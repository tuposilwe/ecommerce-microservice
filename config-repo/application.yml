eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Register under a hostname, not the machine's LAN IP: with
    # prefer-ip-address the registry pins whatever IP the host had at startup,
    # so a DHCP renewal or network switch leaves every already-registered
    # service advertising an address that no longer resolves - callers then
    # hang until TCP timeout instead of failing fast. Deployments that need a
    # routable address set EUREKA_INSTANCE_HOSTNAME per instance.
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      # Every metric carries the service it came from, so one Prometheus job
      # can scrape all eight and still break results down per service.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Publish latency as histogram buckets, not just the default
        # count/sum/max summary - histogram_quantile() (the p95 panel) has
        # nothing to work with otherwise.
        http.server.requests: true
  observations:
    key-values:
      application: ${spring.application.name}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
