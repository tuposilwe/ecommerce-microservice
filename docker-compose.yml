name: ecommerce-microservice

# Only infra that's painful to run locally lives here: Zipkin, Kafka, and
# per-service Postgres databases. The 8 Spring Boot services (eureka-server,
# config-server, api-gateway, user/catalog/cart/order/payment-service) are
# run locally (IDE or `mvn spring-boot:run`) - see README for the run order
# and required env vars. Their application.yml defaults already point at
# localhost:5433-5436 (db), localhost:8761 (eureka), localhost:8888 (config
# server), localhost:9411 (zipkin) and localhost:9092 (kafka), matching the
# ports exposed below.

services:
  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT for host-run Spring services (order-service,
      # payment-service, via localhost:9092), INTERNAL for other containers
      # on the compose network (kafka-ui, via the "kafka" DNS name) - Kafka
      # tells clients where to reconnect via the advertised address, so a
      # single listener can't correctly serve both audiences.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # The scrape targets are host JVMs; on Linux host.docker.internal is not
    # resolved automatically the way Docker Desktop does it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      # 3001 on the host: 3000 is a common dev-server default and is often
      # already taken. Grafana still listens on 3000 inside the container.
      - "3001:3000"
    environment:
      # Local-only stack: skip the login wall and land straight on the
      # provisioned dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # One postgres-exporter per database: each service owns its own Postgres, so
  # there is no single instance to point at. They sit on the compose network,
  # so they reach the databases by service name on 5432 - not the 5433-5436
  # ports published to the host.
  user-db-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@user-db:5432/user_db?sslmode=disable"
    depends_on:
      user-db:
        condition: service_healthy

  catalog-db-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@catalog-db:5432/catalog_db?sslmode=disable"
    depends_on:
      catalog-db:
        condition: service_healthy

  cart-db-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@cart-db:5432/cart_db?sslmode=disable"
    depends_on:
      cart-db:
        condition: service_healthy

  order-db-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@order-db:5432/order_db?sslmode=disable"
    depends_on:
      order-db:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    # INTERNAL listener: this is a container talking to another container, so
    # kafka:29092 rather than the host-advertised localhost:9092.
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      - kafka

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: catalog_db
    ports:
      - "5434:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  cart-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: cart_db
    ports:
      - "5435:5432"
    volumes:
      - cart_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: order_db
    ports:
      - "5436:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  user_db_data:
  catalog_db_data:
  cart_db_data:
  order_db_data:
  prometheus_data:
  grafana_data:
